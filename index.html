<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan ke MyTelkomsel...</title>
  <script>
    (function() {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      
      // Jika pengguna iPhone / iPad
      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        window.location.replace("https://apps.apple.com/app/mytelkomsel/id651516146");
      } 
      // Jika pengguna Android
      else if (/android/i.test(ua)) {
        window.location.replace("https://play.google.com/store/apps/details?id=com.telkomsel.telkomselcm");
      } 
      // Jika dibuka dari Laptop / PC Desktop
      else {
        window.location.replace("https://www.telkomsel.com");
      }
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p>Mengarahkan ke toko aplikasi...</p>
</body>
</html>
